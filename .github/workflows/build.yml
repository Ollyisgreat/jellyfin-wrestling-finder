name: Build & release plugin

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}.0
      PLUGIN_GUID: 7c1d2a4e-5b3f-4e8a-9d61-2f0b8c4a9e17
      TARGET_ABI: 10.11.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.WrestlingFinder/Jellyfin.Plugin.WrestlingFinder.csproj \
            -c Release -o out \
            -p:Version=$VERSION -p:AssemblyVersion=$VERSION -p:FileVersion=$VERSION

      - name: Package
        run: |
          mkdir pkg
          cp out/Jellyfin.Plugin.WrestlingFinder.dll pkg/
          cat > pkg/meta.json <<EOF
          {
            "category": "General",
            "changelog": "Build ${{ github.run_number }}",
            "description": "Type a wrestling event, find its proper name, search YouTube / Internet Archive / Dailymotion and download your pick into Jellyfin.",
            "guid": "$PLUGIN_GUID",
            "name": "Wrestling Finder",
            "overview": "Find and download wrestling events",
            "owner": "${{ github.repository_owner }}",
            "targetAbi": "$TARGET_ABI",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "$VERSION",
            "status": "Active",
            "autoUpdate": true
          }
          EOF
          cd pkg && zip -r ../wrestling-finder_$VERSION.zip . && cd ..
          CHECKSUM=$(md5sum wrestling-finder_$VERSION.zip | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/wrestling-finder_$VERSION.zip"
          cat > manifest.json <<EOF
          [
            {
              "guid": "$PLUGIN_GUID",
              "name": "Wrestling Finder",
              "description": "Type a wrestling event, find its proper name, search YouTube / Internet Archive / Dailymotion and download your pick into Jellyfin.",
              "overview": "Find and download wrestling events",
              "owner": "${{ github.repository_owner }}",
              "category": "General",
              "versions": [
                {
                  "version": "$VERSION",
                  "changelog": "Build ${{ github.run_number }}",
                  "targetAbi": "$TARGET_ABI",
                  "sourceUrl": "$URL",
                  "checksum": "$CHECKSUM",
                  "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                }
              ]
            }
          ]
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "wrestling-finder_$VERSION.zip" manifest.json \
            --title "Wrestling Finder $VERSION" \
            --notes "Add this repository in Jellyfin (Dashboard → Plugins → Repositories): https://github.com/${{ github.repository }}/releases/latest/download/manifest.json" \
            --latest
